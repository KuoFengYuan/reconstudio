    <button type="button" class="quick-start" onclick="startWorkflow('frames')"><span class="quick-icon" aria-hidden="true">▤</span><strong>我有影片 <span aria-hidden="true">→</span></strong><small>擷取清晰影格，準備重建素材</small></button>
    <button type="button" class="quick-start" onclick="startWorkflow('colmap')"><span class="quick-icon" aria-hidden="true">▧</span><strong>我有照片 <span aria-hidden="true">→</span></strong><small>對齊相機，重建場景與點雲</small></button>
