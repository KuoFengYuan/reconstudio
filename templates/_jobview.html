<div class="rs-panel">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
    <strong>{{ {'frames':'🎬','train':'🧠','mesh':'🧩','gcs':'☁️'}.get(job.kind,'📐') }} {{ job.title }}</strong>
    <code class="hint">{{ job.kind }} · {{ job.id }}</code>
  </div>
  <div class="hint" style="margin-bottom:10px">{{ job.subtitle }}</div>

  <!-- status + stage stepper; self-polls while running, then stops -->
  <div id="jobstatus"
       hx-get="/ui/jobstatus/{{ job.id }}"
       hx-trigger="load, every 2s"
       hx-swap="outerHTML"></div>

  {% if job.kind == 'matte' and job.meta.get('images') %}
  <!-- Live cut-out strip: its own island (see the matte_live route's docstring
       for why it must not live inside #jobstatus), so it schedules its own
       refresh instead of retriggering off that node's 2s replacement.
       Mounted for ANY status, deliberately: create_matte renders this fragment
       the instant the job is submitted, when it is still `queued`, and nothing
       re-renders _jobview.html afterwards — gating on 'running' here meant the
       strip only ever appeared if you re-opened the job from 歷史紀錄. The
       route decides whether to keep polling (queued/running) or settle after
       one load (done/failed), so an always-mounted island is correct. -->
  <div id="matte_live"
       hx-get="/ui/matte_live?images={{ job.meta.get('images','')|urlencode }}&n=8&job_id={{ job.id }}"
       hx-trigger="load" hx-swap="outerHTML"></div>
  {% endif %}

  <!-- log stream is started by startLogStream() in index.html on htmx:afterSwap
       (htmx doesn't reliably execute inline <script> in swapped fragments). -->
  <!-- 硯 (inkstone) — a warm-charcoal slab so the live log stays legible against washi -->
  <pre id="log" data-log-job="{{ job.id }}"
       style="background:#1c1812;border:1px solid var(--line2);border-radius:8px;
       padding:12px;margin-top:12px;height:55vh;overflow:auto;white-space:pre-wrap;
       font:12px/1.45 ui-monospace,monospace;color:#ece3d1"></pre>
</div>
