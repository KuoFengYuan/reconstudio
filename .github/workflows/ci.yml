name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install (panel + dev tools)
        # Pure-Python deps only; the heavy CUDA trainer envs and external binaries
        # (colmap / ffmpeg) are runtime prerequisites and aren't needed to lint/test.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (typed modules)
        run: mypy pipeline/config.py
      - name: Pytest
        run: pytest
